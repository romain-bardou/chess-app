name: Import et analyse

on:
  schedule:
    # Toutes les 6 heures : une partie jouée le matin est révisable le soir.
    # Le dépôt est public, donc les minutes Actions ne sont pas décomptées.
    - cron: "20 */6 * * *"
  workflow_dispatch:
    inputs:
      max_games:
        description: "Nombre max de parties à analyser sur ce run"
        required: false
        default: "40"

# Un run d'analyse peut durer 50 minutes : on ne veut pas que le suivant
# démarre en parallèle et traite deux fois les mêmes parties.
concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    # Garde-fou sur la durée : au-delà, le run est coupé et les parties
    # restantes seront reprises au run suivant (elles restent analyzed=false).
    timeout-minutes: 50

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Installer Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends stockfish
          stockfish quit < /dev/null | head -1

      - name: Installer les dépendances Python
        run: pip install -r analysis/requirements.txt

      - name: Importer les parties chess.com
        id: import
        # Une panne de l'API chess.com ne doit pas empêcher d'analyser les
        # parties déjà en base : on encaisse l'échec ici et on fait rougir le
        # job à la dernière étape.
        continue-on-error: true
        working-directory: analysis
        env:
          CHESS_COM_USERNAME: ormaniba
          IMPORT_TIME_CLASSES: rapid
        run: python import_games.py

      - name: Analyser
        working-directory: analysis
        env:
          STOCKFISH_PATH: /usr/games/stockfish
          ENGINE_MOVETIME_MS: "400"
          ENGINE_DEPTH: "14"
          ENGINE_MULTIPV: "4"
          ENGINE_THREADS: "2"
          MAX_GAMES_PER_RUN: ${{ github.event.inputs.max_games || '40' }}
        run: python main.py

      - name: Signaler l'échec de l'import
        if: steps.import.outcome == 'failure'
        run: |
          echo "L'import chess.com a échoué (voir l'étape « Importer »)." >&2
          exit 1
