name: Réanalyse par lots

# Déclenchement manuel uniquement : la réanalyse des anciennes parties se fait
# à la demande, petit lot par petit lot, jamais sur un cron.
on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Nombre de parties déjà analysées à repasser sur ce run"
        required: false
        default: "20"

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  reanalyze:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Installer Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends stockfish
          stockfish quit < /dev/null | head -1

      - name: Installer les dépendances Python
        run: pip install -r analysis/requirements.txt

      - name: Réanalyser
        working-directory: analysis
        env:
          STOCKFISH_PATH: /usr/games/stockfish
          ENGINE_MOVETIME_MS: "400"
          ENGINE_DEPTH: "14"
          ENGINE_MULTIPV: "4"
          ENGINE_THREADS: "2"
          REANALYZE_BATCH: ${{ github.event.inputs.batch_size || '20' }}
        run: python reanalyze.py
