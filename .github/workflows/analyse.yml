name: Analyse des parties

on:
  schedule:
    # 04h20 UTC : les parties de la veille sont importées, et le créneau est
    # peu chargé côté runners GitHub.
    - cron: "20 4 * * *"
  workflow_dispatch:
    inputs:
      max_games:
        description: "Nombre max de parties à analyser sur ce run"
        required: false
        default: "40"

jobs:
  analyse:
    runs-on: ubuntu-latest
    # Garde-fou sur les minutes gratuites : au-delà, le run est coupé et les
    # parties restantes seront reprises demain (elles restent analyzed=false).
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: analysis/requirements.txt

      - name: Installer Stockfish
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends stockfish
          stockfish quit < /dev/null | head -1

      - name: Installer les dépendances Python
        run: pip install -r analysis/requirements.txt

      - name: Analyser
        working-directory: analysis
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STOCKFISH_PATH: /usr/games/stockfish
          ENGINE_MOVETIME_MS: "400"
          ENGINE_DEPTH: "14"
          ENGINE_MULTIPV: "4"
          ENGINE_THREADS: "2"
          MAX_GAMES_PER_RUN: ${{ github.event.inputs.max_games || '40' }}
        run: python main.py
